repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        entry: black -l 79

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        # Run on demand: pre-commit run pytest --hook-stage manual
        # (CI runs the full suite on every PR.)
        stages: [manual]
        always_run: true
        pass_filenames: false
