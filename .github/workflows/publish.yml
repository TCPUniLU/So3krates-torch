# Build the sdist and wheel for every GitHub release, and publish them to
# TestPyPI or PyPI when run by hand (Actions -> Publish -> Run workflow).
#
# Publishing uses PyPI trusted publishing (no API token). One-time setup:
#   1. On pypi.org (and test.pypi.org) -> project so3krates-torch ->
#      Publishing -> add a GitHub publisher: owner TCPUniLU, repository
#      So3krates-torch, workflow publish.yml, environment pypi
#      (testpypi for TestPyPI).
#   2. In this repository: Settings -> Environments -> create "pypi" and
#      "testpypi" (optionally with required reviewers).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.4.0)"
        required: true
      target:
        description: "Package index"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          tag="${{ inputs.ref || github.ref_name }}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Only on manual dispatch: a release does not upload by itself.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
