# Fine-tuning a pretrained SO3LR with long-range anchoring.
#
# The data (md17_ethanol_small.xyz, 100 ethanol structures) has only
# energies and forces. Without anchoring, nothing keeps the partial charges
# and Hirshfeld (a0) ratios physical: the energy cannot tell short- from
# long-range contributions. With long_range_anchor_weights, a frozen copy
# of the pretrained model predicts them on every batch and the fine-tuned
# model is pulled towards those predictions.
#
# Run from the repository root (paths below are relative to it):
#
#   torchkrates-train --config examples/training/anchoring/finetune_anchoring.yaml
#
# It takes about 10 s on a laptop CPU. Over the 10 epochs the force error
# drops from about 180 to about 20 meV/A, and validation logs how far the
# model has moved away from the pretrained one, e.g.
#   deviation from pretrained model: RMSE_anchor_charges=  0.0239,
#   RMSE_anchor_hirshfeld_ratios=  0.0066
# Outputs go to ./anchoring_example/.
#
# Starting model: the bundled SO3LR v1 weights. The tauri checkpoints work
# the same way, but they have 16 theory levels: copy ARCHITECTURE from their
# *_settings.yaml and give every structure an atoms.info["theory_level"]
# (or fine-tune with convert_to_multihead, which keeps one level).

GENERAL:
  name_exp: ethanol_anchored
  checkpoints_dir: ./anchoring_example/checkpoints
  model_dir: ./anchoring_example/model
  log_dir: ./anchoring_example/logs
  default_dtype: float64
  seed: 42

# Copied from src/so3krates_torch/pretrained/so3lr/v1/so3lr_settings.yaml.
# Only r_max_lr and dispersion_energy_cutoff_lr_damping are set here: the
# v1 checkpoint leaves them unset (null), and a finite neighbour list needs
# both (same values as SO3LRCalculator's defaults).
ARCHITECTURE:
  activation_fn: silu
  avg_num_neighbors: 13.168995780096482
  c6_ratios_bool: false
  cutoff_fn: phys
  degrees: [1, 2, 3, 4]
  dispersion_energy_bool: true
  dispersion_energy_cutoff_lr_damping: 2.0
  dispersion_energy_scale: 1.2
  electrostatic_energy_bool: true
  electrostatic_energy_scale: 4.0
  energy_activation_fn: silu
  energy_learn_atomic_type_scales: true
  energy_learn_atomic_type_shifts: true
  energy_regression_dim: 128
  final_layer_bias: true
  input_convention: positions
  layer_normalization_1: true
  layer_normalization_2: true
  layers_behave_like_identity_fn_at_init: false
  legacy_dispersion_bool: true
  message_normalization: avg_num_neighbors
  nhl_repulsion_bool: false
  num_elements: 118
  num_features: 128
  num_features_head: 32
  num_heads: 4
  num_layers: 3
  num_radial_basis_fn: 32
  num_theory_levels: 1
  output_is_zero_at_init: false
  qk_non_linearity: identity
  qk_norm: false
  r_max: 4.5
  r_max_lr: 12.0
  radial_basis_fn: bernstein
  residual_mlp_1: true
  residual_mlp_2: false
  trainable_rbf: false
  use_charge_embed: true
  use_pme: false
  use_residual_scalars: false
  use_rms_norm: false
  use_simple_hirshfeld: false
  use_spin_embed: true
  zbl_repulsion_bool: true

TRAINING:
  path_to_train_data: ./examples/training/md17_ethanol_small.xyz
  valid_ratio: 0.1
  batch_size: 5
  valid_batch_size: 10
  num_epochs: 10
  lr: 0.0001
  optimizer: adam
  amsgrad: true
  scheduler: exponential_decay
  lr_scheduler_gamma: 0.95
  energy_weight: 1.0
  forces_weight: 100.0
  # Anchoring needs loss_type auto (the default) or properties.
  loss_type: auto

  # Starting model. pretrained_model (a pickled .model) works as well.
  pretrained_weights: ./src/so3krates_torch/pretrained/so3lr/v1/so3lr.pt
  # The data's energies are absolute DFT energies; take the per-element
  # energy shifts from the data instead of the pretrained model.
  force_use_average_shifts: true

  # Train every parameter, including the charge and Hirshfeld heads, which
  # are frozen by default. With frozen heads, anchoring still constrains
  # what the trained backbone feeds into them.
  finetune_choice: naive
  freeze_partial_charges: false
  freeze_hirshfeld: false

  # One weight per anchored quantity (0 or absent = not anchored).
  # Keys: partial_charges (or charges), a0_ratios (or hirshfeld_ratios),
  # c6_ratios (needs a C6 head, e.g. tauri), dipole_vec (or dipole).
  # If the data also has labels for an anchored quantity, a warning says
  # so and both the label term and the anchor term are trained.
  long_range_anchor_weights:
    partial_charges: 1.0
    a0_ratios: 1.0

MISC:
  device: cpu
